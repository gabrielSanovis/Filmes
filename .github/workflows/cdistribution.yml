name: React Native Distribution

on:
  push:
    branches:
      - pre-prod

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          cache: 'yarn'

      - name: Create google-services.json
        run: echo "${{ secrets.GOOGLE }}" | base64 --decode > android/app/google-services.json

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Set execute permission on gradlew
        run: chmod +x ./android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew clean
          ./gradlew assembleRelease
          cd ..

      - name: Clear google-services.json
        run: echo "" > android/app/google-services.json

      - name: Install Firebase CLI
        run: curl -sl https://firebase.tools | bash

      - name: Check Firebase CLI Version
        run: firebase --version

      - name: Upload APK to Firebase App Distribution
        run: firebase appdistribution:distribute android/app/build/outputs/apk/release/app-release.apk --app ${{ secrets.FIREBASE_APP_ID }} --groups "qa-team" --token ${{ secrets.FIREBASE_AUTH_TOKEN }}
